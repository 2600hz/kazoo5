---
version: 2.1

orbs:
  kazoo: official-2600hz/kazoo@0.4.1

parameters:
  otp-version:
    type: string
    default: '23.3.4.5'

workflows:
  version: 2
  build_branch:
    jobs:
      - kazoo/build-preparation:
          context: Private-Builds
          otp-version: << pipeline.parameters.otp-version >>
          target-type: kazoo
      - kazoo/build:
          context: Private-Builds
          requires:
            - kazoo/build-preparation
      - kazoo/eunit-tests:
          context: Private-Builds
          otp-version: << pipeline.parameters.otp-version >>
          requires:
            - kazoo/build-preparation
      - kazoo/code-checks:
          otp-version: << pipeline.parameters.otp-version >>
          requires:
            - kazoo/build
      - kazoo/docs:
          otp-version: << pipeline.parameters.otp-version >>
          requires:
            - kazoo/build
      - kazoo/analyze:
          otp-version: << pipeline.parameters.otp-version >>
          requires:
            - kazoo/build
      - kazoo/integration-test:
          otp-version: << pipeline.parameters.otp-version >>
          requires:
            - kazoo/build
      - kazoo/build-centos7:
          context: Private-Builds
          otp-version: << pipeline.parameters.otp-version >>
          target-type: kazoo
          requires:
            - kazoo/eunit-tests
            - kazoo/code-checks
            - kazoo/docs
            - kazoo/analyze
            - kazoo/integration-test

  build_release:
    jobs:
      - kazoo/build-preparation:
          context: Private-Builds
          otp-version: << pipeline.parameters.otp-version >> 
          target-type: kazoo
          for-packager: "true"
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
      - kazoo/build:
          context: Private-Builds
          otp-version: << pipeline.parameters.otp-version >>
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          requires:
            - kazoo/build-preparation
      - kazoo/eunit-tests:
          context: Private-Builds
          otp-version: << pipeline.parameters.otp-version >>
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          requires:
            - kazoo/build-preparation
      - kazoo/code-checks:
          otp-version: << pipeline.parameters.otp-version >>
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          requires:
            - kazoo/build
      - kazoo/docs:
          otp-version: << pipeline.parameters.otp-version >>
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          requires:
            - kazoo/build
      - kazoo/analyze:
          otp-version: << pipeline.parameters.otp-version >>
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          requires:
            - kazoo/build
      - kazoo/integration-test:
          otp-version: << pipeline.parameters.otp-version >>
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          requires:
            - kazoo/build
      - kazoo/build-centos7:
          context: Private-Builds
          otp-version: << pipeline.parameters.otp-version >>
          target-type: kazoo
          filters:
            tags:
              only: /^\d+\.\d+\.\d+$/
            branches:
              ignore: /.*/
          requires:
            - kazoo/eunit-tests
            - kazoo/code-checks
            - kazoo/docs
            - kazoo/analyze
            - kazoo/integration-test
